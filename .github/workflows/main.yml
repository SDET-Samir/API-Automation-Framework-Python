name: API Automation CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask requests pytest pytest-html

      - name: Run Server and Tests
        run: |
          python server.py & 
          sleep 10
          pytest
