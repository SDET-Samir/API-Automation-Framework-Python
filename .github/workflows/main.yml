name: API Automation CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # بروزرسانی به نسخه 4

      - name: Set up Python
        uses: actions/setup-python@v5 # بروزرسانی به نسخه 5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask requests pytest pytest-html

      - name: Run Server and Tests
        run: |
          python server.py &
          sleep 10
          pytest
