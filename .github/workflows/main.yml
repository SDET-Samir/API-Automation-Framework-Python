name: Professional API CI
on: [push]
jobs:
  automation_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup and Run
        run: |
          pip install flask requests pytest pytest-html
          python server.py &
          sleep 10
          pytest
