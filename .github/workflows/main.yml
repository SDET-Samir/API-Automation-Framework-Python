name: Employee API & UI Multi-Container CI/CD Core Pipeline

on: [push]

jobs:
  run_employee_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository Source
        uses: actions/checkout@v4
      
      - name: Configure Core Python Environment Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Build and Package Employee Application Service Snapshot Image
        run: |
          docker build -f Dockerfile.app -t employee-core-app .

      - name: Start Live Containerized App Server on Port 5001
        run: |
          docker run -d -p 5001:5000 --name employee-service-engine employee-core-app
          sleep 5

      - name: Install Testing Dependencies & Playwright Binaries
        run: |
          pip install requests pytest pytest-html playwright pytest-playwright
          # Let the high-speed cloud server download the headless browser binaries instantly
          playwright install chromium

      - name: Execute Automated Full-Stack Regression Test Suites
        run: |
          python -m pytest **/[tT]est_*.py -v --html=report.html --self-contained-html
