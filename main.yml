name: API Automation CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and Run
        run: |
          pip install flask requests pytest pytest-html
          python server.py &
          sleep 10
          pytest
